// Fabric 1.21.1 适配模块（M0 骨架，需 Gradle 8.x + Loom 1.9）
plugins {
    id 'fabric-loom' version '1.9.2'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // 与 common/Forge 保持同一套 Mojmap 命名（Loom 官方 Mojang mappings）
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api}"
    implementation project(':common')
}

base {
    archivesName = 'veincore-fabric'
}

// 展开 fabric.mod.json 里的 ${version} 占位
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// 收尾：把 common 的核心类打进同一 jar（common 无 MC 依赖，remap 对其无影响）；懒加载避免配置期交叉配置
jar {
    from(project(':common').tasks.named('jar').map { zipTree(it.archiveFile) })
}
